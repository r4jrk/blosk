services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
      POSTGRES_DB: comments
    networks: [comments]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comments']
      interval: 2s
      timeout: 2s
      retries: 20

  # Redis wire-compatible, so the client is plain ioredis.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ulimits:
      memlock: -1
    networks: [comments]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://comments:comments@postgres:5432/comments
      REDIS_URL: redis://dragonfly:6379
      PORT: '3000'
    ports: ['3000:3000']
    networks: [comments]
    depends_on:
      postgres: { condition: service_healthy }
      dragonfly: { condition: service_healthy }

networks:
  comments:
